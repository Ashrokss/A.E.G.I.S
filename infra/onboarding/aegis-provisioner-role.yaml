AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AEGIS provisioning role. Lets AEGIS run Terraform in this account, and nothing
  more: PowerUserAccess for ordinary resources, plus IAM limited to roles that
  carry the AegisBoundary permissions boundary, so no role AEGIS creates can
  exceed that boundary or modify this role.

Parameters:
  TrustedRoleArn:
    Type: String
    Description: The AEGIS ECS task role (shown on the AEGIS Accounts page).
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
  ExternalId:
    Type: String
    Description: The ExternalId AEGIS generated for this onboarding. Do not change it.
    MinLength: 16
  RoleSuffix:
    Type: String
    Default: default
    Description: Distinguishes several AEGIS roles in one account (a-z, 0-9, dash).
    AllowedPattern: "^[a-z0-9-]{1,32}$"

Resources:
  # Every role the agent creates must carry this boundary. It allows ordinary
  # service actions and denies the paths to privilege escalation.
  AegisBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub AegisBoundary-${RoleSuffix}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowWorkloads
            Effect: Allow
            Action: "*"
            Resource: "*"
          - Sid: NoIdentityEscalation
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:AddUserToGroup
              - iam:AttachUserPolicy
              - iam:PutUserPolicy
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - organizations:*
              - account:*
            Resource: "*"
          - Sid: ProtectAegisControlPlane
            Effect: Deny
            Action: iam:*
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/AegisProvisioner-*
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/AegisBoundary-*
          # State files hold resource secrets; workloads never need them.
          - Sid: NoTerraformState
            Effect: Deny
            Action: s3:*
            Resource:
              - arn:aws:s3:::aegis-tfstate-*
              - arn:aws:s3:::aegis-tfstate-*/*

  # Terraform state for every AEGIS run in this account, one key per run
  # (runs/<run_id>/terraform.tfstate), locked with Terraform's S3 lockfile.
  # Retained on stack deletion: losing state orphans the resources it tracks.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub aegis-tfstate-${AWS::AccountId}-${RoleSuffix}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldStateVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub ${StateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AegisProvisioner-${RoleSuffix}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        # Everything except IAM / Organizations / Account management.
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: BoundedIam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Creating a role, or granting one permissions, requires the boundary.
              - Sid: RolesMustCarryBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref AegisBoundary
              - Sid: ManageRolesAndPolicies
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:ListRoleTags
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:DeleteRole
                  - iam:PassRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:ListInstanceProfiles
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:TagPolicy
                  - iam:CreateServiceLinkedRole
                Resource: "*"
              # Never touch the AEGIS control plane itself, whatever the above allows.
              - Sid: ProtectAegisControlPlane
                Effect: Deny
                NotAction:
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/AegisProvisioner-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:policy/AegisBoundary-*
              - Sid: NoBoundaryRemoval
                Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                Resource: "*"
              # Terraform needs Get/Put/Delete object (the lockfile) and List.
              # Everything that could expose, weaken or erase state is denied.
              - Sid: ProtectStateBucket
                Effect: Deny
                Action:
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketAcl
                  - s3:PutBucketOwnershipControls
                  - s3:PutReplicationConfiguration
                  - s3:DeleteObjectVersion
                  - s3:PutObjectAcl
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub ${StateBucket.Arn}/*

Outputs:
  RoleArn:
    Description: Paste this into AEGIS to finish onboarding.
    Value: !GetAtt ProvisionerRole.Arn
  BoundaryArn:
    Description: Permissions boundary every AEGIS-created role must carry.
    Value: !Ref AegisBoundary
  StateBucket:
    Description: Terraform state for AEGIS runs in this account (runs/<run_id>/terraform.tfstate).
    Value: !Ref StateBucket
