name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: agent/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Tests (plain assert scripts)
        run: |
          for t in tests/test_*.py; do
            n="$(basename "$t" .py)"; echo "::group::$n"
            python -m "tests.$n"
            echo "::endgroup::"
          done

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: node --check scripts/create-admin.js

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_COGNITO_DOMAIN: https://example.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_CLIENT_ID: ci-placeholder

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for d in infra/terraform/bootstrap infra/terraform/environments/prod; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - run: bash infra/terraform/scripts/check-module-vars.sh
      - name: checkov (IaC misconfiguration scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform,cloudformation
          quiet: true
          # ponytail: advisory until the first baseline is triaged; then set false.
          soft_fail: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy (dependency + secret scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
